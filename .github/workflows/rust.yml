name: Rust

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package release binary
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/fm dist/

          tar -C dist -czf \
            "furmint-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            fm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: furmint-${{ matrix.target }}
          path: furmint-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  build-windows:
    name: Build Windows Release Binary
    runs-on: windows-latest

    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build Windows release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows binary
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/fm.exe dist/

          Compress-Archive `
            -Path dist/fm.exe `
            -DestinationPath "furmint-$version-x86_64-pc-windows-msvc.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: furmint-x86_64-pc-windows-msvc
          path: furmint-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip

  release:
    name: Publish Release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip