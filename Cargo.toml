[package]
name = "fm"
version = "0.2.3"
edition = "2024"
publish = false

[features]
test-utils = []

[dependencies]
anyhow = "1.0"
arboard = "3.6"
async-trait = "0.1"
base64 = "0.22"
bzip2 = "0.6"
chrono = "0.4"
cpio = "0.4"
directories = "6.0"
encoding_rs = "0.8"
filetime = "0.2"
flate2 = "1.1"
fuzzy-matcher = "0.3"
globset = "0.4"
image = { version = "0.25", features = ["default"] }
libc = "0.2"
lumis = { version = "0.17", default-features = false, features = [
    "lang-bash",
    "lang-c",
    "lang-cmake",
    "lang-cpp",
    "lang-css",
    "lang-dockerfile",
    "lang-go",
    "lang-html",
    "lang-ini",
    "lang-java",
    "lang-javascript",
    "lang-json",
    "lang-markdown",
    "lang-python",
    "lang-rust",
    "lang-toml",
    "lang-yaml",
    "lang-xml",
] }
md5 = "0.8"
memmap2 = "0.9"
notify = "8.2"
notify-debouncer-full = "0.7"
rand = "0.10"
ratatui = { version = "0.30.2", features = ["termina"] }
ratatui-image = { version = "11.0", default-features = false, features = ["tokio", "image-defaults"] }
regex = "1.13"
ring = "0.17"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust2 = { version = "0.22", features = ["deflate", "zstd"] }
shell-words = "1.1"
tar = "0.4"
tempfile = "3.27"
termina = "0.3"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
trash = "5.2"
unicode-width = "0.2"
walkdir = "2.5"
xz2 = "0.1"
zeroize = "1.9"
zip = "8.6"
zstd = "0.14"

[target.'cfg(unix)'.dependencies]
shell-escape = "0.1"

[target.'cfg(windows)'.dependencies]
open = "5.4"
winapi = { version = "0.3.9", features = ["shellapi", "fileapi", "winnt"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
fm = { path = ".", features = ["test-utils"] }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
opt-level = "s"
panic = "abort"
debug = "full" 
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM
incremental = true

[lints.clippy]
pedantic = "warn"
