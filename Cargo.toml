[package]
name = "fm"
version = "0.1.0"
edition = "2024"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3.23"

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
bytesize = "2.3"
chrono = "0.4"
crossterm = "0.29"
directories = "6.0"
filetime = "0.2"
fuzzy-matcher = "0.3"
libc = "0.2"
md5 = "0.8"
notify = "8.2"
notify-debouncer-full = "0.6"
rand = "0.8"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.3"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
unicode-width = "0.2"
trash = "5.2"
open = "5.3"
shell-escape = "0.1"
shell-words = "1.1"
ssh2 = "0.9"
openssh = "0.11"
clipboard = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
winapi = { version = "0.3.9", features = ["shellapi"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
