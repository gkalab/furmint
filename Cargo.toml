[package]
name = "fm"
version = "0.1.0"
edition = "2024"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
fm = { path = ".", features = ["test-utils"] }

[features]
test-utils = []

[dependencies]
async-trait = "0.1"
anyhow = "1.0"
bytesize = "2.3"
chrono = "0.4"
crossterm = "0.29"
directories = "6.0"
filetime = "0.2"
fuzzy-matcher = "0.3"
libc = "0.2"
md5 = "0.8"
notify = "8.2"
notify-debouncer-full = "0.7"
rand = "0.9"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lumis = { version = "0.9", default-features = false, features = [
    "lang-bash",
    "lang-c",
    "lang-cmake",
    "lang-cpp",
    "lang-css",
    "lang-dockerfile",
    "lang-go",
    "lang-html",
    "lang-ini",
    "lang-java",
    "lang-javascript",
    "lang-json",
    "lang-markdown",
    "lang-python",
    "lang-rust",
    "lang-toml",
    "lang-yaml",
    "lang-xml",
] }
tokio = { version = "1.52", features = ["full"] }
tempfile = "3.27"
toml = "1.1"
unicode-width = "0.2"
trash = "5.2"
open = "5.3"
shell-escape = "0.1"
shell-words = "1.1"
clipboard = "0.4"
image = { version = "0.25", features = ["default"] }
ratatui-image = { version = "10.0", default-features = false, features = ["tokio", "image-defaults", "crossterm"] }
zip = "8.6"
walkdir = "2.5"
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6"
xz2 = "0.1"
cpio = "0.4"
zstd = "0.13"
memmap2 = "0.9"
encoding_rs = "0.8"
secrecy = "0.10"
zeroize = "1.8"
regex = "1.12.3"

[target.'cfg(windows)'.dependencies]
russh = { version = "0.59", default-features = false, features = ["ring"] }
russh-sftp = "2.1"

winreg = "0.55"
winapi = { version = "0.3.9", features = ["shellapi", "fileapi", "winnt"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
openssh = "0.11"
ssh2 = "0.9.5"

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.clippy]
pedantic = "warn"
